<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Main Nexus Gradient -->
    <linearGradient id="nexusGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D5FA"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="glowGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D5FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Background Base Gradient for Icon Tile -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c192c"/>
      <stop offset="100%" stop-color="#040914"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="nexusShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00D5FA" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Rounded Rect Base -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bgGrad)" stroke="#00D5FA" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Glowing Nexus "N" Emblem -->
  <g filter="url(#nexusShadow)">
    <!-- Left Vertical Pillar -->
    <rect x="22" y="24" width="12" height="52" rx="6" fill="url(#nexusGrad)"/>

    <!-- Right Vertical Pillar -->
    <rect x="66" y="24" width="12" height="52" rx="6" fill="url(#nexusGrad)"/>

    <!-- Diagonal Interlink Beam -->
    <path d="M22 28 L78 72" stroke="url(#nexusGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Central Intersection Node (Pulse Core) -->
    <circle cx="50" cy="50" r="7" fill="#ffffff"/>
    <circle cx="50" cy="50" r="11" fill="#00D5FA" fill-opacity="0.5"/>
    <circle cx="50" cy="50" r="15" stroke="#00D5FA" stroke-width="1.5" stroke-opacity="0.8" stroke-dasharray="3 3"/>
  </g>
</svg>
