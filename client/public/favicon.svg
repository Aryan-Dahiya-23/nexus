<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D5FA"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background Pill Shape for Favicon Visibility -->
  <rect width="100" height="100" rx="28" fill="#040914"/>
  <rect width="100" height="100" rx="28" stroke="#00D5FA" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Left Pillar -->
  <rect x="20" y="22" width="13" height="56" rx="6.5" fill="url(#favGrad)"/>

  <!-- Right Pillar -->
  <rect x="67" y="22" width="13" height="56" rx="6.5" fill="url(#favGrad)"/>

  <!-- Diagonal Link -->
  <path d="M22 28 L78 72" stroke="url(#favGrad)" stroke-width="13" stroke-linecap="round"/>

  <!-- Core Pulse Point -->
  <circle cx="50" cy="50" r="7.5" fill="#ffffff"/>
  <circle cx="50" cy="50" r="12" fill="#00D5FA" fill-opacity="0.6"/>
</svg>
